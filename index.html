<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hawton Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#screen { display: block; image-rendering: pixelated; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; font-family: 'Press Start 2P', monospace; }
  #touch.on { display: block; }
  #stick { position: absolute; left: 28px; bottom: 28px; width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); pointer-events: auto; }
  #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22); }
  .btn { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); font-size: 11px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; user-select: none; -webkit-user-select: none; }
  #bE { right: 28px; bottom: 96px; }
  #bF { right: 96px; bottom: 40px; }
  #bR { right: 28px; bottom: 24px; width: 58px; height: 58px; }
  #bM { right: 28px; top: 20px; width: 44px; height: 44px; font-size: 9px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="bE">E</div>
  <div class="btn" id="bF">F</div>
  <div class="btn" id="bR">RUN</div>
  <div class="btn" id="bM">MAP</div>
</div>
<script src="src/world.js"></script>
<script src="src/sprite.js"></script>
<script src="src/post.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
